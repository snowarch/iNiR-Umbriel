[keybinds]
# Session and compositor
"Mod+Tab" = { action = "overview-toggle", repeat = false }
"Mod+Shift+E" = { action = "session-quit", repeat = false }
"Mod+Escape" = { action = "spawn:true", repeat = false }
"Mod+Shift+O" = "dpms-off"

# iNiR surfaces
"Super+G" = "spawn:inir overlay toggle"
"Mod+Space" = { action = "spawn:inir overview toggle", repeat = false }
"Mod+V" = "spawn:inir clipboard toggle"
"Mod+Alt+L" = { action = "spawn:inir lock activate", allow_when_locked = true }
"Mod+Ctrl+Shift+L" = { action = "spawn:inir lock focus", allow_when_locked = true }
"Mod+Shift+S" = "spawn:inir region menu"
"Mod+Shift+X" = "spawn:inir region ocr"
"Mod+Shift+A" = "spawn:inir region search"
"Ctrl+Shift+S" = "spawn:inir region menu"
"Ctrl+Alt+T" = "spawn:inir wallpaperSelector toggle"
"Mod+Comma" = "spawn:inir settings"
"Mod+Slash" = "spawn:inir cheatsheet toggle"
"Mod+Shift+W" = "spawn:inir panelFamily cycle"
"Mod+Shift+Q" = "spawn:inir session toggle"
"Ctrl+Alt+F" = "spawn:inir equalizer toggle"

# Applications
"Mod+T" = "spawn:inir terminal"
"Mod+Return" = "spawn:inir terminal"
"Super+E" = "spawn:nautilus"
"Super+W" = "spawn:inir browser"

# Window management
"Mod+Q" = { action = "spawn:inir close-window", repeat = false }
"Mod+D" = "window-toggle-maximize"
"Mod+F" = "window-toggle-fullscreen"
"Mod+A" = "window-toggle-floating"
"Mod+Shift+V" = "window-focus-switch-floating"

# Scrolling layout
"Mod+R" = "window-cycle-width"
"Mod+Shift+R" = "spawn:inir region recordWithSound"
"Mod+Ctrl+R" = { action = "spawn:true", repeat = false }
"Mod+C" = "column-center"
"Mod+Minus" = "window-modify-width:-0.1"
"Mod+Equal" = "window-modify-width:0.1"
"Mod+Shift+Minus" = "window-modify-height:-0.1"
"Mod+Shift+Equal" = "window-modify-height:0.1"
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"

# Focus
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"

# Move windows and columns
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

# Outputs
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Right" = "output-focus-right"
"Mod+Ctrl+Up" = "output-focus-up"
"Mod+Ctrl+Down" = "output-focus-down"
"Mod+Ctrl+Shift+Left" = "column-move-to-output-left"
"Mod+Ctrl+Shift+Right" = "column-move-to-output-right"
"Mod+Ctrl+Shift+Up" = "column-move-to-output-up"
"Mod+Ctrl+Shift+Down" = "column-move-to-output-down"

# Workspaces
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Ctrl+1" = "column-move-to-workspace:1"
"Mod+Ctrl+2" = "column-move-to-workspace:2"
"Mod+Ctrl+3" = "column-move-to-workspace:3"
"Mod+Ctrl+4" = "column-move-to-workspace:4"
"Mod+Ctrl+5" = "column-move-to-workspace:5"
"Mod+Ctrl+6" = "column-move-to-workspace:6"
"Mod+Ctrl+7" = "column-move-to-workspace:7"
"Mod+Ctrl+8" = "column-move-to-workspace:8"
"Mod+Ctrl+9" = "column-move-to-workspace:9"
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "column-move-to-workspace-previous"
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"

# Screenshots
"Print" = { action = "spawn:inir region menu", repeat = false }
"Ctrl+Print" = { action = "spawn:inir umbriel-screenshot screen", repeat = false }
"Alt+Print" = { action = "spawn:inir umbriel-screenshot window", repeat = false }

# Hardware keys
"XF86AudioRaiseVolume" = { action = "spawn:inir audio volumeUp", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:inir audio volumeDown", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:inir audio mute", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn:inir audio micMute", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:inir brightness increment", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:inir brightness decrement", allow_when_locked = true }
"XF86AudioPlay" = "spawn:inir mpris playPause"
"XF86AudioPause" = "spawn:inir mpris playPause"
"XF86AudioNext" = "spawn:inir mpris next"
"XF86AudioPrev" = "spawn:inir mpris previous"
"Ctrl+Mod+Space" = "spawn:inir mpris playPause"
"Mod+Alt+N" = "spawn:inir mpris next"
"Mod+Alt+P" = "spawn:inir mpris previous"
"Mod+Shift+M" = "spawn:inir audio mute"
"Mod+Shift+P" = "spawn:inir mpris playPause"
"Mod+Shift+N" = "spawn:inir mpris next"
"Mod+Shift+B" = "spawn:inir mpris previous"

# Umbriel has no Niri Recent Windows surface yet.
"Alt+Tab" = { action = "window-focus-next", repeat = false }
"Alt+Shift+Tab" = { action = "window-focus-previous", repeat = false }

# Consume built-ins that iNiR intentionally leaves unbound.
"Mod+F1" = { action = "spawn:true", repeat = false }
"Mod+Period" = { action = "spawn:true", repeat = false }
"Mod+Ctrl+F" = { action = "spawn:true", repeat = false }
"Mod+M" = { action = "spawn:true", repeat = false }
"Mod+P" = { action = "spawn:true", repeat = false }
"Mod+O" = { action = "spawn:true", repeat = false }
